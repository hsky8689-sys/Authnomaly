services:
  authnomaly:
    image: authnomaly:latest
    build:
      context: .
      dockerfile: Authnomaly/Dockerfile
    ports:
      - ${AUTHNOMALY_MAIN_PORT}
    env_file: .env
    environment:
        - DB_HOST=main_database
        - REDIS_HOST=redis
        - ASPNETCORE_ENVIRONMENT=Development
        - AUTHNOMALY_DB_MAX_CONNECTIONS=${AUTHNOMALY_DB_MAX_CONNECTIONS}
        - AUTHNOMALY_DB_STATEMENT_TIMEOUT=${AUTHNOMALY_DB_STATEMENT_TIMEOUT}
        - GEO_LOCALDB_PATH=/geo/GeoLite2-City.mmdb
        - LOG_DIR=/logs
    volumes:
      - ${GEO_CONTAINER_PATH}
      - ${LOG_DIR}:/logs
    depends_on:
      main_database:
        condition: service_healthy
  main_database:
    image: postgres:18
    command:
      - "postgres"
      - "-c"
      - "max_connections=${AUTHNOMALY_DB_MAX_CONNECTIONS}"
      - "-c"
      - "statement_timeout=${AUTHNOMALY_DB_STATEMENT_TIMEOUT}"
    ports:
      - ${MAIN_DATABASE_PORT}
    restart: always
    environment:
      - POSTGRES_USER=${DB_LOGIN_USERNAME}
      - POSTGRES_DB=${DB_MAIN_NAME}
      - POSTGRES_PASSWORD=${AUTHNOMALY_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - main_data:/var/lib/postgresql
  redis:
    image: redis:8.8
    restart: always
    ports:
      - ${REDIS_MAIN_PORT}
volumes:
    main_data:
       driver: local
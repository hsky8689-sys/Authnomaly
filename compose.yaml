services:
  authnomaly:
    image: authnomaly:latest
    build:
      context: .
      dockerfile: Authnomaly/Dockerfile
    env_file: .env
    environment:
        - DB_HOST=main_database
        - REDIS_HOST=redis
    depends_on:
      main_database:
        condition: service_started
  main_database:
    image: postgres:18
    ports:
      - ${MAIN_DATABASE_PORT}
    restart: always
    environment:
      - POSTGRES_USER=${DB_LOGIN_USERNAME}
      - POSTGRES_DB=${DB_MAIN_NAME}
      - POSTGRES_PASSWORD=${AUTHNOMALY_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - main_data:/var/lib/postgresql
  redis:
    image: redis:latest
volumes:
    main_data:
       driver: local
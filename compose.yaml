services:
  authnomaly:
    image: authnomaly:latest
    build:
      context: .
      dockerfile: Authnomaly/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
        - DB_HOST=main_database
        - REDIS_HOST=redis
        - ASPNETCORE_ENVIRONMENT=Development
        - GEO_LOCALDB_PATH=127.0.0.1:.:ro
    depends_on:
      main_database:
        condition: service_healthy
  main_database:
    image: postgres:18
    ports:
      - ${MAIN_DATABASE_PORT}
    restart: always
    environment:
      - POSTGRES_USER=${DB_LOGIN_USERNAME}
      - POSTGRES_DB=${DB_MAIN_NAME}
      - POSTGRES_PASSWORD=${AUTHNOMALY_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - main_data:/var/lib/postgresql
  redis:
    image: redis:8.8
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
volumes:
    main_data:
       driver: local